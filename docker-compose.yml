services:
  b2b_app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: filament_b2b_app
    volumes:
      - ./src:/var/www
    networks:
      - b2b_net

  b2b_db:
    image: mysql:8.0
    container_name: filament_b2b_db
    ports:
      - "3310:3306"
    environment:
      MYSQL_DATABASE: new_istanbul_b2b
      MYSQL_USER: b2b_user
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - b2b_mysql_data:/var/lib/mysql
    networks:
      - b2b_net

  b2b_web:
    image: nginx:alpine
    container_name: filament_b2b_web
    ports:
      - "8010:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - b2b_app
    networks:
      - b2b_net

networks:
  b2b_net:
    driver: bridge

volumes:
  b2b_mysql_data:
    driver: local
